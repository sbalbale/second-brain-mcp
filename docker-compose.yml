# docker-compose.yml
#
# Runs the MCP server + a cloudflared sidecar so the server is reachable at
# your public Cloudflare Tunnel hostname without opening any inbound ports.
#
# Required env (in .env next to this file):
#   VAULT_PATH=/absolute/host/path/to/your/vault
#   AUTH_TOKEN=<generated secret>
#   CF_TUNNEL_TOKEN=<token copied from Cloudflare Zero Trust dashboard>
#   CF_ACCESS_TEAM_DOMAIN=<your-team>.cloudflareaccess.com  (optional but recommended)
#   CF_ACCESS_AUD=<application audience tag from CF Access>  (optional but recommended)

services:
  mcp:
    image: ghcr.io/sbalbale/second-brain-mcp:latest
    pull_policy: always
    restart: unless-stopped
    environment:
      VAULT_ROOT: /vault
      TRANSPORT: http
      HOST: 0.0.0.0
      PORT: 8787
      AUTH_TOKEN: ${AUTH_TOKEN}
      CF_ACCESS_TEAM_DOMAIN: ${CF_ACCESS_TEAM_DOMAIN:-}
      CF_ACCESS_AUD: ${CF_ACCESS_AUD:-}
      VAULT_AUTOCOMMIT: ${VAULT_AUTOCOMMIT:-true}
      DEFAULT_RESPONSE_FORMAT: ${DEFAULT_RESPONSE_FORMAT:-markdown}
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-30}
      CACHE_MAX_ENTRIES: ${CACHE_MAX_ENTRIES:-1000}
      MAX_READ_CONCURRENCY: ${MAX_READ_CONCURRENCY:-16}
      MAX_WRITE_CONCURRENCY: ${MAX_WRITE_CONCURRENCY:-1}
      GIT_CONCURRENCY: ${GIT_CONCURRENCY:-1}
      RAG_QUERY_CONCURRENCY: ${RAG_QUERY_CONCURRENCY:-2}
      QMD_UPDATE_DEBOUNCE_MS: ${QMD_UPDATE_DEBOUNCE_MS:-2000}
    volumes:
      - ${VAULT_PATH}:/vault
      - qmd-config:/home/app/.config/qmd   # collection + context definitions
      - qmd-models:/home/app/.cache/qmd    # ~2GB GGUF models — survives image updates
    # Do NOT publish ports to the host. cloudflared reaches us over the
    # internal docker network.
    expose:
      - "8787"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - mcpnet

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - mcpnet

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN}
    depends_on:
      - mcp
    networks:
      - mcpnet

networks:
  mcpnet:
    driver: bridge

volumes:
  qmd-config:   # qmd collection + context config (~trivial size)
  qmd-models:   # qmd GGUF model cache (~2GB, expensive to re-download)
  redis-data:   # self-hosted Redis cache persistence
